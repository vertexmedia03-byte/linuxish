name: Build iSH ARM64 IPA for TrollStore

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build and package iSH ARM64 for TrollStore
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: brew install llvm lld ninja libarchive meson

      - name: Build iSH ARM64
        run: |
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            clean build

      - name: Package TrollStore IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iSH ARM64.app"
          IPA_ROOT="$RUNNER_TEMP/ipa"
          test -d "$APP_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/iSH ARM64.app"
          ditto -c -k --sequesterRsrc --keepParent "$IPA_ROOT/Payload" "$RUNNER_TEMP/iSH-ARM64.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-trollstore-ipa
          path: ${{ runner.temp }}/iSH-ARM64.ipa
          if-no-files-found: error
