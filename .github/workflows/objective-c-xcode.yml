name: Build unsigned iOS IPA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build and package HelloWorld
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and analyze
        run: |
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build analyze

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HelloWorld.app"
          IPA_ROOT="$RUNNER_TEMP/ipa"
          test -d "$APP_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/HelloWorld.app"
          ditto -c -k --sequesterRsrc --keepParent "$IPA_ROOT/Payload" "$RUNNER_TEMP/HelloWorld.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-unsigned-ipa
          path: ${{ runner.temp }}/HelloWorld.ipa
          if-no-files-found: error
